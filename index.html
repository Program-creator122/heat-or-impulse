<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>لعبة المتاهة المتقدمة</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to top, #4facfe, #00f2fe);
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: auto;
      background: #e0ffe0;
      border: 4px solid #333;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let man, women, children;
    let walls;
    let controllerConnected = false;

    window.addEventListener("gamepadconnected", () => controllerConnected = true);
    window.addEventListener("gamepaddisconnected", () => controllerConnected = false);

    function initGame(){
      man = {x: 50, y: 50, size: 30, color: "#1e90ff"};
      women = [
        {x: 700, y: 500, size: 30, color: "#ff1493", speed: 3, mode:"chase"},
        {x: 100, y: 500, size: 30, color: "#ff69b4", speed: 2.5, mode:"mirror"},
        {x: 700, y: 100, size: 30, color: "#db7093", speed: 2.8, mode:"reverse"}
      ];
      children = [
        {x: 400, y: 300, size: 25, color: "#ffa500"}
      ];
      walls = [
        {x:100,y:100,w:600,h:20},
        {x:100,y:200,w:20,h:300},
        {x:200,y:200,w:500,h:20},
        {x:300,y:300,w:20,h:200},
        {x:400,y:400,w:300,h:20},
        {x:600,y:100,w:20,h:300}
      ];
    }

    function drawRect(obj){
      ctx.fillStyle = obj.color;
      ctx.fillRect(obj.x, obj.y, obj.size, obj.size);
    }

    function drawWalls(){
      ctx.fillStyle = "#333";
      walls.forEach(w => ctx.fillRect(w.x,w.y,w.w,w.h));
    }

    function collide(obj){
      for(let w of walls){
        if(obj.x < w.x+w.w && obj.x+obj.size > w.x &&
           obj.y < w.y+w.h && obj.y+obj.size > w.y){
          return true;
        }
      }
      return false;
    }

    function randomChild(){
      return {
        x: Math.floor(Math.random()*(canvas.width-100))+50,
        y: Math.floor(Math.random()*(canvas.height-100))+50,
        size: 25,
        color: "#ffa500"
      };
    }

    let lastDx=0, lastDy=0; 

    function update(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      drawWalls();
      children.forEach(c=>drawRect(c));
      drawRect(man);
      women.forEach(w => drawRect(w));

      // تحكم الرجل بالـ Gamepad
      if(controllerConnected){
        const gp = navigator.getGamepads()[0];
        if(gp){
          let dx = gp.axes[0]*4;
          let dy = gp.axes[1]*4;
          man.x += dx;
          man.y += dy;
          if(collide(man)){ man.x -= dx; man.y -= dy; }
          lastDx = dx;
          lastDy = dy;
        }
      }

      // حركة النساء
      women.forEach(w=>{
        if(w.mode==="chase"){
          let target = children[0];
          let dx = target.x - w.x;
          let dy = target.y - w.y;
          let dist = Math.sqrt(dx*dx+dy*dy);
          if(dist>1){
            w.x += (dx/dist)*w.speed;
            w.y += (dy/dist)*w.speed;
            if(collide(w)){ w.x -= (dx/dist)*w.speed; w.y -= (dy/dist)*w.speed; }
          }
        } else if(w.mode==="mirror"){
          w.x += lastDx*0.8;
          w.y += lastDy*0.8;
          if(collide(w)){ w.x -= lastDx*0.8; w.y -= lastDy*0.8; }
        } else if(w.mode==="reverse"){
          // حركة عكسية لحركة الرجل
          w.x -= lastDx*0.8;
          w.y -= lastDy*0.8;
          if(collide(w)){ w.x += lastDx*0.8; w.y += lastDy*0.8; }
        }

        // تماس بين الرجل والمرأة → الطفل يتغيّر مكانه
        if(Math.abs(man.x-w.x)<20 && Math.abs(man.y-w.y)<20){
          children.forEach((c,i)=>children[i]=randomChild());
        }
      });

      requestAnimationFrame(update);
    }

    initGame();
    update();
  </script>
</body>
</html>
